name: Build PS3 KM2PAD

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository
        run: |
          echo "=== Repository files ==="
          find . -maxdepth 4 -type f | sort

      - name: Find project archive
        run: |
          echo "=== Searching for ZIP ==="
          find . -type f -iname "*.zip" -print

      - name: Extract project
        run: |
          ZIP_FILE="$(find . -maxdepth 2 -type f -iname 'PS3xPAD_NOVA_MouseSmooth_0.4_HEN.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP was not found."
            exit 1
          fi

          mkdir -p project
          unzip -o "$ZIP_FILE" -d project

      - name: Check source
        run: |
          echo "=== Source files ==="
          find project -type f | sort

          test -f project/ps3xpad_review/src/Makefile
          test -f project/ps3xpad_review/src/main.c
          test -f project/ps3xpad_review/src/libc.c

      - name: Inspect required build environment
        working-directory: project/ps3xpad_review/src
        run: |
          echo "=== Makefile ==="
          cat Makefile

          echo
          echo "=== CELL_SDK ==="
          if [ -n "${CELL_SDK:-}" ]; then
            echo "CELL_SDK=$CELL_SDK"
          else
            echo "CELL_SDK is NOT SET"
          fi

          echo
          echo "=== Required tools ==="
          for tool in \
            ppu-lv2-gcc \
            ppu-lv2-strip \
            ppu-lv2-ar \
            ppu-lv2-ranlib \
            ppu-lv2-ld \
            ppu-lve-prx-exportpickup \
            scetool
          do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "FOUND: $tool"
            else
              echo "MISSING: $tool"
            fi
          done

      - name: Stop before incompatible build
        working-directory: project/ps3xpad_review/src
        run: |
          if [ -z "${CELL_SDK:-}" ]; then
            echo ""
            echo "ERROR: CELL_SDK is not available."
            echo "The original project requires the Sony Cell SDK."
            echo "PS3DEV/PSL1GHT alone cannot build this Makefile as-is."
            exit 1
          fi

          if ! command -v ppu-lv2-gcc >/dev/null 2>&1; then
            echo ""
            echo "ERROR: ppu-lv2-gcc is missing."
            exit 1
          fi

          echo "Required build environment detected."

      - name: Build project
        working-directory: project/ps3xpad_review/src
        run: |
          make

      - name: Find output
        run: |
          mkdir -p output

          find project -type f \( \
            -name "*.sprx" -o \
            -name "*.prx" -o \
            -name "*.self" -o \
            -name "*.elf" \
          \) -exec cp {} output/ \;

          echo "=== OUTPUT ==="
          ls -lah output

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: PS3-KM2PAD-Build
          path: output/
          if-no-files-found: error
          
