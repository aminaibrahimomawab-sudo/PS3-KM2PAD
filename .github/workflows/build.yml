name: PS3 KM HEN

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project
        shell: bash
        run: |
          set -e

          echo "Checking PS3 KM HEN project..."

          test -f Makefile
          test -d .src
          test -f .src/main.c

          echo "Makefile: OK"
          echo ".src directory: OK"
          echo ".src/main.c: OK"
          echo "Project verification completed successfully."
