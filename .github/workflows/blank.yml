name: Build PS3 KM2PAD

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download PS3DEV
        run: |
          git clone --depth 1 https://github.com/ps3dev/ps3dev.git /tmp/ps3dev

      - name: Install PS3DEV dependencies
        working-directory: /tmp/ps3dev
        run: |
          chmod +x prepare.sh
          sudo ./prepare.sh

      - name: Prepare PS3DEV directory
        run: |
          sudo mkdir -p /usr/local/ps3dev
          sudo chown -R "$USER:" /usr/local/ps3dev

      - name: Build PS3DEV
        working-directory: /tmp/ps3dev
        run: |
          chmod +x build-all.sh
          export PS3DEV=/usr/local/ps3dev
          export PSL1GHT=/usr/local/ps3dev
          export PATH="$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin"
          ./build-all.sh

      - name: Configure PS3DEV
        run: |
          echo "PS3DEV=/usr/local/ps3dev" >> "$GITHUB_ENV"
          echo "PSL1GHT=/usr/local/ps3dev" >> "$GITHUB_ENV"
          echo "/usr/local/ps3dev/bin" >> "$GITHUB_PATH"
          echo "/usr/local/ps3dev/ppu/bin" >> "$GITHUB_PATH"
          echo "/usr/local/ps3dev/spu/bin" >> "$GITHUB_PATH"

      - name: Check PS3 tools
        run: |
          ppu-gcc --version
          which ppu-gcc

      - name: Check project ZIP
        run: |
          test -f PS3xPAD_NOVA_MouseSmooth_0.4_HEN.zip
          unzip -t PS3xPAD_NOVA_MouseSmooth_0.4_HEN.zip

      - name: Extract project
        run: |
          mkdir -p project
          unzip -o PS3xPAD_NOVA_MouseSmooth_0.4_HEN.zip -d project
          find project -type f | sort

      - name: Check source files
        run: |
          test -f project/ps3xpad_review/src/Makefile
          test -f project/ps3xpad_review/src/main.c
          test -f project/ps3xpad_review/src/libc.c
          test -f project/ps3xpad_review/src/ControlStruct.h

      - name: Check original build requirements
        working-directory: project/ps3xpad_review/src
        run: |
          echo "=== Makefile ==="
          cat Makefile
          echo "=== Required tools ==="
          command -v ppu-lv2-gcc || true
          command -v ppu-lv2-strip || true
          command -v scetool || true
          echo "=== Environment ==="
          echo "CELL_SDK=${CELL_SDK:-NOT_SET}"
          echo "PS3DEV=${PS3DEV:-NOT_SET}"
          echo "PSL1GHT=${PSL1GHT:-NOT_SET}"

      - name: Build project
        working-directory: project/ps3xpad_review/src
        run: |
          make

      - name: Find PS3 output
        run: |
          mkdir -p output
          find project -type f \( \
            -name "*.sprx" -o \
            -name "*.prx" -o \
            -name "*.self" -o \
            -name "*.elf" \
          \) -exec cp {} output/ \;
          echo "=== BUILD OUTPUT ==="
          ls -lah output

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: PS3-KM2PAD-Build
          path: output/
          if-no-files-found: error
