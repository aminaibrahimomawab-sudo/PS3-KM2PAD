name: Build PS3 Project

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: psl1ght/psl1ght:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show files
        run: |
          echo "Repository files:"
          find . -maxdepth 4 -type f | sort

      - name: Build
        run: |
          if [ -f Makefile ]; then
            make
          elif [ -f makefile ]; then
            make
          else
            echo "ERROR: No Makefile found"
            exit 1
          fi

      - name: Find PS3 outputs
        run: |
          find . -type f \( -name "*.sprx" -o -name "*.prx" -o -name "*.self" -o -name "*.elf" \) -print

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: PS3-build
          path: |
            **/*.sprx
            **/*.prx
            **/*.self
            **/*.elf
          if-no-files-found: error
