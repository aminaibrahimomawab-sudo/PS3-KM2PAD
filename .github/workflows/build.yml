name: PS3 KM HEN Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          set -e
          test -f Makefile
          test -f .src/main.c
          echo "Project files OK"

      - name: Build PS3 toolchain
        run: |
          git clone --depth 1 https://github.com/ps3dev/ps3toolchain.git
          cd ps3toolchain
          ./toolchain.sh
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Build project
        run: |
          export CELL_SDK="$HOME/ps3dev"
          make

      - name: Show build output
        run: |
          find . -type f \( -name "*.prx" -o -name "*.sprx" -o -name "*.self" \) -print

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: PS3-KM2PAD-build
          path: |
            **/*.prx
            **/*.sprx
            **/*.self
          if-no-files-found: warn 
