name: PS3 KM HEN Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project
        run: |
          test -f src/main.c
          test -f Makefile
          echo "Project files OK"

      - name: Show build status
        run: |
          echo "PS3-KM-HEN source is ready."
          echo "Final SPRX compilation requires the compatible PS3 VSH/PRX toolchain."
